version: '3.1'

services:
  postgres_db:
    image: postgres:15.2
    container_name: postgres_siadi_db
    restart: always
    environment:
      POSTGRES_DB: siadi_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - 5433:5432